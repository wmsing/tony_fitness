<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>健身拳击 — 砸角落怪物</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="hud">
      <div class="hud-block">
        <span class="label">分数</span>
        <span id="score">0</span>
      </div>
      <div class="hud-block wide">
        <span class="label" id="prompt">准备开始</span>
        <div class="hp-bar"><div id="hp-fill"></div></div>
        <span id="hp-text">—</span>
      </div>
      <div class="hud-block">
        <span class="label">连击</span>
        <span id="combo">0</span>
      </div>
    </header>

    <main class="stage">
      <video id="video" playsinline autoplay muted></video>
      <canvas id="canvas"></canvas>
      <div id="flash"></div>
    </main>
    <div class="yt-dock" aria-label="运动播放列表">
      <div id="yt-player"></div>
    </div>

    <div class="playlist-menu" id="playlist-menu">
      <button id="playlist-toggle" type="button" class="secondary" aria-expanded="false" aria-controls="playlist-pop">
        播放列表
      </button>
      <div id="playlist-pop" class="playlist-pop" hidden role="dialog" aria-label="更换 YouTube 播放列表">
        <label class="playlist-label" for="playlist-input">粘贴链接或 ID</label>
        <input
          id="playlist-input"
          type="text"
          inputmode="url"
          autocomplete="off"
          spellcheck="false"
          placeholder="YouTube 播放列表链接或 ID"
        />
        <div class="playlist-pop-actions">
          <button id="playlist-cancel" type="button" class="secondary">取消</button>
          <button id="playlist-btn" type="button">更换</button>
        </div>
      </div>
    </div>

    <footer class="controls">
      <p id="status">点击开始，允许摄像头权限</p>
      <div class="btn-row">
        <button id="camera-btn" type="button" class="secondary">打开摄像头</button>
        <button id="bg-btn" type="button" class="secondary">地图背景</button>
        <button id="start-btn" type="button">开始运动</button>
      </div>
    </footer>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
