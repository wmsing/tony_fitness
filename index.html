<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>健身拳击 — 砸角落怪物</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="hud">
      <div class="hud-block">
        <span class="label">分数</span>
        <span id="score">0</span>
      </div>
      <div class="hud-block wide">
        <span class="label" id="prompt">准备开始</span>
        <div class="hp-bar"><div id="hp-fill"></div></div>
        <span id="hp-text">—</span>
      </div>
      <div class="hud-block">
        <span class="label">连击</span>
        <span id="combo">0</span>
      </div>
    </header>

    <main class="stage">
      <video id="video" playsinline autoplay muted></video>
      <canvas id="canvas"></canvas>
      <div id="flash"></div>
    </main>

    <footer class="controls">
      <p id="status">点击开始，允许摄像头权限</p>
      <div class="btn-row">
        <button id="camera-btn" type="button" class="secondary">打开摄像头</button>
        <button id="start-btn" type="button">开始运动</button>
      </div>
    </footer>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
