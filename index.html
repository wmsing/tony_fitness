<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tony Fitness — 守村保卫</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <section id="settings-panel" class="settings-panel" hidden aria-label="设置">
      <div class="settings-inner">
        <h2 class="settings-title">设置</h2>
        <p class="settings-label" id="difficulty-label">难度</p>
        <div class="difficulty-row" role="group" aria-labelledby="difficulty-label">
          <button type="button" class="diff-btn" data-diff="easy">简单</button>
          <button type="button" class="diff-btn" data-diff="normal">普通</button>
          <button type="button" class="diff-btn" data-diff="hard">困难</button>
          <button type="button" class="diff-btn" data-diff="insane">地狱</button>
        </div>
        <p id="difficulty-desc" class="settings-desc">敌兵密度适中，适合日常锻炼。</p>

        <p class="settings-label" id="weapon-left-label">左手武器</p>
        <div id="weapon-left-grid" class="weapon-grid" role="group" aria-labelledby="weapon-left-label"></div>
        <p class="settings-label" id="weapon-right-label">右手武器</p>
        <div id="weapon-right-grid" class="weapon-grid" role="group" aria-labelledby="weapon-right-label"></div>

        <button id="settings-back" type="button" class="settings-back">返回守村</button>
      </div>
    </section>

    <header class="hud">
      <div class="hud-block">
        <span class="label" id="score-label">分数</span>
        <span id="score">0</span>
      </div>
      <div class="hud-block wide">
        <span class="label" id="prompt">准备开始</span>
        <div class="hp-bar"><div id="hp-fill"></div></div>
        <span id="hp-text">—</span>
      </div>
      <div class="hud-block">
        <span class="label" id="combo-label">连击</span>
        <span id="combo">0</span>
      </div>
    </header>

    <main class="stage">
      <video id="video" playsinline autoplay muted></video>
      <canvas id="canvas"></canvas>
      <div id="flash"></div>
    </main>
    <div class="yt-dock" aria-label="运动播放列表">
      <div class="yt-meta">
        <div id="yt-song" class="yt-song">等待曲目…</div>
        <div id="yt-artist" class="yt-artist">—</div>
      </div>
      <div class="yt-player-wrap">
        <div id="yt-player"></div>
      </div>
      <div class="yt-transport">
        <button id="yt-prev" type="button" class="yt-skip" title="上一首" aria-label="上一首">‹</button>
        <button id="yt-mode" type="button" class="yt-mode" title="切换随机 / 单曲循环" aria-label="切换播放模式">随机</button>
        <button id="yt-next" type="button" class="yt-skip" title="下一首" aria-label="下一首">›</button>
      </div>
    </div>

    <div class="playlist-menu" id="playlist-menu">
      <button id="menu-btn" type="button" class="secondary">菜单</button>
      <button id="playlist-toggle" type="button" class="secondary" aria-expanded="false" aria-controls="playlist-pop">
        播放列表
      </button>
      <div id="playlist-pop" class="playlist-pop" hidden role="dialog" aria-label="更换 YouTube 播放列表">
        <label class="playlist-label" for="playlist-input">粘贴链接或 ID</label>
        <input
          id="playlist-input"
          type="text"
          inputmode="url"
          autocomplete="off"
          spellcheck="false"
          placeholder="YouTube 播放列表链接或 ID"
        />
        <div class="playlist-pop-actions">
          <button id="playlist-cancel" type="button" class="secondary">取消</button>
          <button id="playlist-btn" type="button">更换</button>
        </div>
      </div>
    </div>

    <div id="result-overlay" class="result-overlay" hidden>
      <div class="result-card">
        <h2 id="result-title">村庄沦陷</h2>
        <p id="result-body"></p>
        <button id="result-menu-btn" type="button">再战守村</button>
      </div>
    </div>

    <footer class="controls">
      <p id="status">选择模式后开始运动</p>
      <div class="btn-row">
        <button id="camera-btn" type="button" class="secondary">打开摄像头</button>
        <button id="bg-btn" type="button" class="secondary">地图背景</button>
        <button id="start-btn" type="button">开始运动</button>
      </div>
    </footer>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
